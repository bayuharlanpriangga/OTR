<!--
  OTR — Ikon PWA (Phase 24)
  ---------------------------------------------------------------------------
  SVG orisinal dibuat untuk sesi ini (bukan aset pihak ketiga/berlisensi) --
  motif bulan sabit + bintang konsisten tema tarot/malam, warna diambil dari
  css/variables.css (background gelap "#14111c", aksen krem/emas).

  Dipakai DUA KALI di manifest.json (purpose "any" dan "maskable") dari file
  yang SAMA -- konten utama (bulan+bintang) sengaja digambar di dalam
  lingkaran "safe zone" 80% dari canvas (r=205 dari total 512x512, safe zone
  standar maskable icon), supaya kalau Android memotongnya jadi bentuk
  circle/squircle, tidak ada bagian penting yang terpotong.

  KETERBATASAN YANG DIDOKUMENTASIKAN (lihat PROJECT_STATUS.md Known Issues
  Phase 24): ini SVG tunggal, BUKAN set PNG raster 192x192/512x512 yang
  biasanya direkomendasikan untuk kompatibilitas maksimal (terutama iOS
  Safari "Add to Home Screen" yang dukungan SVG-nya kurang konsisten
  dibanding Android/Chrome). Sandbox sesi ini tidak punya pipeline
  image-generation untuk aset brand berlisensi/final -- kalau Orias mau
  ikon final yang didesain, sebaiknya diekspor jadi PNG di beberapa ukuran
  dari SVG ini (atau desain baru) sebelum rilis produksi sungguhan.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#14111c" />
  <circle cx="256" cy="256" r="205" fill="none" />
  <path
    d="M 300 150
       A 120 120 0 1 0 300 362
       A 150 150 0 1 1 300 150 Z"
    fill="#f4e9d8"
  />
  <g fill="#d8b46a">
    <path d="M 356 210 L 364 230 L 384 238 L 364 246 L 356 266 L 348 246 L 328 238 L 348 230 Z" />
    <circle cx="392" cy="290" r="6" />
    <circle cx="336" cy="310" r="4" />
  </g>
</svg>
